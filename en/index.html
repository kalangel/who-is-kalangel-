<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>kalangel</title>
    <meta name="description" content="The eclipse holds. Observation continues." />
    <meta name="theme-color" content="#050302" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="kalangel" />
    <meta property="og:description" content="The eclipse holds. Observation continues." />
    <meta property="og:image" content="../og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="wordmark"></div>

    <div class="plate">
      <p class="mono" data-t="corner.mark"></p>
      <div class="right">
        <p class="mono" data-t="corner.time"></p>
        <p class="mono" id="clock"></p>
      </div>
    </div>

    <!-- Такты стоят на месте и сменяют друг друга. Скролл — это скраббер
         по одной сцене, а не лента секций. -->
    <div class="beats">
      <section class="beat">
        <p class="mono label" data-t="b1.label"></p>
        <h1 class="line" data-t="b1.line"></h1>
      </section>
      <section class="beat">
        <p class="mono label" data-t="b2.label"></p>
        <h2 class="line" data-t="b2.line"></h2>
      </section>
      <section class="beat">
        <p class="mono label" data-t="b3.label"></p>
        <h2 class="line" data-t="b3.line"></h2>
      </section>
      <section class="beat">
        <p class="mono label" data-t="b4.label"></p>
        <h2 class="line" data-t="b4.line"></h2>
      </section>
      <section class="beat beat--end">
        <p class="mono label" data-t="b5.label"></p>
        <h2 class="line" data-t="b5.line"></h2>
        <!-- TODO: подставить настоящую ссылку на канал (см. README) -->
        <p class="mono cta" data-t="b5.cta"></p>
      </section>
    </div>

    <p class="mono scroll-hint" data-t="hero.scroll"></p>

    <!-- Пустые якоря дают высоту прокрутки и точки привязки для тактов. -->
    <main aria-hidden="true">
      <div class="anchor"></div>
      <div class="anchor"></div>
      <div class="anchor"></div>
      <div class="anchor"></div>
      <div class="anchor"></div>
    </main>

    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
