<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Атом бренда: центральная четырёхлучевая звезда из вордмарка.
    Полное написание на 32px превращается в грязь, звезда читается.
    Внутри кольца — она же затмеваемое светило.
  -->
  <rect width="100" height="100" fill="#050302"/>
  <path fill="#FF8A1F"
        d="M 50 6
           C 51.8 30.5 55.5 43.2 84 50
           C 55.5 56.8 51.8 69.5 50 94
           C 48.2 69.5 44.5 56.8 16 50
           C 44.5 43.2 48.2 30.5 50 6 Z"/>
</svg>
